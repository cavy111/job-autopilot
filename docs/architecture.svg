<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 800" font-family="'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Job Application Autopilot — System Architecture</title>
  <desc id="desc">A multi-agent pipeline hosted on Alibaba Cloud. A FastAPI dashboard triggers an orchestrator that scrapes jobs, scores and tailors applications using Qwen Cloud function-calling, pauses at a human approval checkpoint, then sends emails via Gmail and tracks everything in SQLite.</desc>

  <rect x="0" y="0" width="1180" height="800" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="46" font-size="26" font-weight="700" fill="#1A2B44">Job Application Autopilot — System Architecture</text>
  <text x="40" y="72" font-size="14.5" fill="#5B6B7F">Multi-agent pipeline on Alibaba Cloud, powered by Qwen Cloud function-calling · Track 4: Autopilot Agent</text>

  <!-- Legend -->
  <g font-size="12.5" fill="#40506A">
    <rect x="40"  y="90" width="14" height="14" rx="3" fill="#2F6FB0"/><text x="60"  y="102">App service</text>
    <rect x="150" y="90" width="14" height="14" rx="3" fill="#6C4CC4"/><text x="170" y="102">Qwen Cloud (LLM)</text>
    <rect x="315" y="90" width="14" height="14" rx="3" fill="#D98A16"/><text x="335" y="102">External API</text>
    <rect x="430" y="90" width="14" height="14" rx="3" fill="#2E9E6B"/><text x="450" y="102">Human checkpoint</text>
    <rect x="585" y="90" width="14" height="14" rx="3" fill="#6B7A90"/><text x="605" y="102">Data store</text>
  </g>

  <!-- Arrowheads -->
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6B7F"/>
    </marker>
    <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6C4CC4"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E9E6B"/>
    </marker>
  </defs>

  <!-- User -->
  <rect x="40" y="150" width="150" height="66" rx="10" fill="#EEF4FA" stroke="#2F6FB0" stroke-width="1.5"/>
  <text x="115" y="180" font-size="14.5" font-weight="600" fill="#1A2B44" text-anchor="middle">User</text>
  <text x="115" y="200" font-size="12" fill="#5B6B7F" text-anchor="middle">Browser</text>

  <!-- External: vacancymail -->
  <rect x="40" y="430" width="150" height="66" rx="10" fill="#FBF1DF" stroke="#D98A16" stroke-width="1.5"/>
  <text x="115" y="460" font-size="13.5" font-weight="600" fill="#7A4D06" text-anchor="middle">vacancymail.co.zw</text>
  <text x="115" y="479" font-size="11.5" fill="#93701F" text-anchor="middle">job board (HTML)</text>

  <!-- Alibaba Cloud container -->
  <rect x="215" y="130" width="640" height="640" rx="14" fill="#F7FAFD" stroke="#2F6FB0" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="235" y="156" font-size="14" font-weight="700" fill="#2F6FB0">Alibaba Cloud — ECS / Function Compute</text>

  <!-- Frontend -->
  <rect x="245" y="172" width="580" height="86" rx="10" fill="#E6EFF8" stroke="#2F6FB0" stroke-width="1.5"/>
  <text x="265" y="200" font-size="15.5" font-weight="700" fill="#1A2B44">FastAPI + Jinja2 Dashboard</text>
  <text x="265" y="223" font-size="12.5" fill="#40506A">Upload CV · Run pipeline · Live status</text>
  <text x="265" y="242" font-size="12.5" fill="#40506A">Approve / Reject staged applications</text>

  <!-- Orchestrator label -->
  <text x="245" y="286" font-size="13.5" font-weight="700" fill="#2F6FB0">Orchestrator — main.py</text>

  <!-- Pipeline steps -->
  <!-- step template: box + number badge -->
  <g font-size="13.5" fill="#1A2B44">
    <!-- 1 CV Parser -->
    <rect x="245" y="298" width="360" height="44" rx="8" fill="#EEF4FA" stroke="#2F6FB0" stroke-width="1.3"/>
    <circle cx="267" cy="320" r="12" fill="#2F6FB0"/><text x="267" y="325" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="290" y="325" font-weight="600">CV Parser</text>
    <circle cx="588" cy="320" r="10.5" fill="#6C4CC4"/><text x="588" y="324.5" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Q</text>

    <!-- 2 Job Scraper -->
    <rect x="245" y="350" width="360" height="44" rx="8" fill="#EEF4FA" stroke="#2F6FB0" stroke-width="1.3"/>
    <circle cx="267" cy="372" r="12" fill="#2F6FB0"/><text x="267" y="377" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="290" y="377" font-weight="600">Job Scraper</text>
    <text x="440" y="377" font-size="11.5" fill="#5B6B7F">httpx + BeautifulSoup</text>

    <!-- 3 Relevance Filter -->
    <rect x="245" y="402" width="360" height="44" rx="8" fill="#EEF4FA" stroke="#2F6FB0" stroke-width="1.3"/>
    <circle cx="267" cy="424" r="12" fill="#2F6FB0"/><text x="267" y="429" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="290" y="429" font-weight="600">Relevance Filter</text>
    <text x="410" y="429" font-size="11.5" fill="#5B6B7F">score 0–100</text>
    <circle cx="588" cy="424" r="10.5" fill="#6C4CC4"/><text x="588" y="428.5" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Q</text>

    <!-- 4 CV Tailor -->
    <rect x="245" y="454" width="360" height="44" rx="8" fill="#EEF4FA" stroke="#2F6FB0" stroke-width="1.3"/>
    <circle cx="267" cy="476" r="12" fill="#2F6FB0"/><text x="267" y="481" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="290" y="481" font-weight="600">CV Tailor</text>
    <text x="410" y="481" font-size="11.5" fill="#5B6B7F">.docx output</text>
    <circle cx="588" cy="476" r="10.5" fill="#6C4CC4"/><text x="588" y="480.5" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Q</text>

    <!-- 5 Cover Letter -->
    <rect x="245" y="506" width="360" height="44" rx="8" fill="#EEF4FA" stroke="#2F6FB0" stroke-width="1.3"/>
    <circle cx="267" cy="528" r="12" fill="#2F6FB0"/><text x="267" y="533" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">5</text>
    <text x="290" y="533" font-weight="600">Cover Letter</text>
    <text x="410" y="533" font-size="11.5" fill="#5B6B7F">.docx output</text>
    <circle cx="588" cy="528" r="10.5" fill="#6C4CC4"/><text x="588" y="532.5" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Q</text>

    <!-- Human approval gate -->
    <rect x="245" y="558" width="360" height="46" rx="8" fill="#E4F4EC" stroke="#2E9E6B" stroke-width="1.8"/>
    <text x="267" y="586" font-size="16">⏸</text>
    <text x="292" y="580" font-weight="700" fill="#1E6B47">Human Approval Checkpoint</text>
    <text x="292" y="597" font-size="11.5" fill="#2E7D56">no email is sent without your approval</text>

    <!-- 6 Submission -->
    <rect x="245" y="612" width="360" height="44" rx="8" fill="#EEF4FA" stroke="#2F6FB0" stroke-width="1.3"/>
    <circle cx="267" cy="634" r="12" fill="#2F6FB0"/><text x="267" y="639" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">6</text>
    <text x="290" y="639" font-weight="600">Submission</text>
    <text x="410" y="639" font-size="11.5" fill="#5B6B7F">Gmail API</text>

    <!-- 7 Tracker + Follow-up -->
    <rect x="245" y="664" width="360" height="44" rx="8" fill="#EEF4FA" stroke="#2F6FB0" stroke-width="1.3"/>
    <circle cx="267" cy="686" r="12" fill="#2F6FB0"/><text x="267" y="691" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">7</text>
    <text x="290" y="691" font-weight="600">Tracker + Follow-up</text>
    <text x="440" y="691" font-size="11.5" fill="#5B6B7F">lifecycle · +7-day nudge</text>
  </g>

  <!-- SQLite data store -->
  <g>
    <ellipse cx="720" cy="668" rx="70" ry="14" fill="#E7ECF2" stroke="#6B7A90" stroke-width="1.4"/>
    <path d="M650,668 v34 a70,14 0 0 0 140,0 v-34" fill="#E7ECF2" stroke="#6B7A90" stroke-width="1.4"/>
    <text x="720" y="694" font-size="12.5" font-weight="600" fill="#3A4658" text-anchor="middle">SQLite</text>
    <text x="720" y="710" font-size="11" fill="#6B7A90" text-anchor="middle">applications.db</text>
  </g>

  <!-- Qwen Cloud -->
  <rect x="905" y="398" width="235" height="120" rx="12" fill="#EFEAFA" stroke="#6C4CC4" stroke-width="1.8"/>
  <text x="1022" y="432" font-size="15.5" font-weight="700" fill="#3F2C77" text-anchor="middle">Qwen Cloud</text>
  <text x="1022" y="453" font-size="12" fill="#5B4A8C" text-anchor="middle">DashScope · model: qwen-plus</text>
  <text x="1022" y="474" font-size="12" fill="#5B4A8C" text-anchor="middle">function-calling (tools API)</text>
  <text x="1022" y="495" font-size="11" fill="#6C4CC4" text-anchor="middle">structured JSON output</text>

  <!-- Gmail API -->
  <rect x="905" y="612" width="235" height="66" rx="10" fill="#FBF1DF" stroke="#D98A16" stroke-width="1.5"/>
  <text x="1022" y="642" font-size="14" font-weight="700" fill="#7A4D06" text-anchor="middle">Gmail API</text>
  <text x="1022" y="661" font-size="11.5" fill="#93701F" text-anchor="middle">OAuth2 · application + follow-up</text>

  <!-- ===== Connectors ===== -->
  <g stroke="#5B6B7F" stroke-width="1.6" fill="none">
    <!-- User <-> Dashboard -->
    <path d="M190,183 H245" marker-end="url(#ah)"/>
    <path d="M245,205 H192 V216" marker-end="url(#ah)"/>
    <!-- Dashboard -> Orchestrator (step1) -->
    <path d="M425,258 V298" marker-end="url(#ah)"/>
    <!-- vacancymail -> scraper (step2) -->
    <path d="M190,463 H222 V372 H245" marker-end="url(#ah)"/>
    <!-- submission -> Gmail -->
    <path d="M605,634 H905" marker-end="url(#ah)"/>
    <!-- tracker <-> SQLite -->
    <path d="M605,686 H650" marker-end="url(#ah)"/>
    <!-- follow-up -> Gmail (dashed) -->
    <path d="M720,634 V620 H905" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  </g>

  <!-- Qwen function-calling arrows (steps 1,3,4,5) -->
  <g stroke="#6C4CC4" stroke-width="1.5" fill="none" opacity="0.9">
    <path d="M598,320 H900 V415" stroke-dasharray="4 3" marker-end="url(#ahp)"/>
    <path d="M598,424 H905" marker-end="url(#ahp)"/>
    <path d="M598,476 H880 V470 H905" stroke-dasharray="4 3"/>
    <path d="M598,528 H860 V500 H905" stroke-dasharray="4 3" marker-end="url(#ahp)"/>
  </g>
  <text x="700" y="405" font-size="11.5" fill="#6C4CC4" font-weight="600">function calling</text>

  <!-- Human approval tie to Dashboard -->
  <g stroke="#2E9E6B" stroke-width="1.6" fill="none">
    <path d="M605,581 H640 V250 Q640,240 630,240 H500" stroke-dasharray="6 4" marker-end="url(#ahg)"/>
  </g>
  <text x="648" y="420" font-size="11.5" fill="#2E9E6B" font-weight="600" transform="rotate(90 648,420)">Approve / Reject</text>

  <!-- Flow labels -->
  <text x="205" y="176" font-size="10.5" fill="#8091A5">HTTP</text>
  <text x="430" y="282" font-size="10.5" fill="#8091A5">run</text>
</svg>
